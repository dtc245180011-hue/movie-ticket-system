auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /home/diepdinhhan/movie-ticket-system/monitoring/loki-data
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /home/diepdinhhan/movie-ticket-system/monitoring/loki-data/chunks
      rules_directory: /home/diepdinhhan/movie-ticket-system/monitoring/loki-data/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
